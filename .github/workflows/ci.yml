name: CI

# Manual only: run it from the Actions tab when you want the tests.
# Pushes and pull requests don't start it.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Test and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Tests
        run: cargo test
        env:
          RUSTFLAGS: -D warnings

      - name: Build (no warnings allowed)
        run: cargo build --release
        env:
          RUSTFLAGS: -D warnings
