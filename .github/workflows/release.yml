name: Release

# Runs only when a version tag is pushed (git tag v1.2.3 && git push origin v1.2.3),
# or by hand from the Actions tab to rebuild an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Check the tag name
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "'$env:TAG' is not a version tag like v1.2.3 or v1.2.3-beta.1."
            exit 1
          }

      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Check the tag is on main
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "$env:TAG is not on the main branch. Only commits on main are released."
            exit 1
          }

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = ((Get-Content Cargo.toml) -match '^version')[0].Split('"')[1]
          if ("v$version" -ne $env:TAG) {
            Write-Error "Tag $env:TAG doesn't match the version in Cargo.toml ($version). Change one of them."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # No Rust cache on purpose: caches saved by a tag run can't be read by the
      # next tag, so saving one only adds upload time.
      - name: Build
        run: cargo build --release --locked

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - name: Make installer and portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V2 "/DVERSION=$v" installer\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $portable = "dist\Coverly-$v-portable"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item target\release\coverly.exe $portable
          Copy-Item -Recurse templates "$portable\templates"
          Copy-Item README.md, LICENSE $portable
          Compress-Archive -Path "$portable\*" -DestinationPath "dist\Coverly-$v-portable.zip" -Force

          # The in-app updater reads this file to verify what it downloaded.
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      # Notes come from the commits between the previous tag and this one (cliff.toml).
      - name: Generate release notes
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          git cliff --current --strip header -o RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @"

          ### Downloads
          - **Coverly-Setup-$v.exe**: installer (recommended)
          - **Coverly-$v-portable.zip**: no install, unzip and run ``coverly.exe``

          Needs Windows 10 or 11 (Microsoft Edge WebView2, built into Windows, is used for Google search).
          Check a download with ``SHA256SUMS.txt``.
          "@ | Add-Content -Encoding utf8 RELEASE_NOTES.md
          Get-Content RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Coverly ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.prerelease == 'false' }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/Coverly-Setup-${{ steps.version.outputs.version }}.exe
            dist/Coverly-${{ steps.version.outputs.version }}-portable.zip
            dist/SHA256SUMS.txt
